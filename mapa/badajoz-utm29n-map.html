<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de Badajoz - Edificios por año (UTM 29N)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
      .leaflet-tile {
        filter: grayscale(1) contrast(0.5) brightness(1.3);
      }
      .leaflet-interactive:focus {
        outline: none;
        box-shadow: none;
      }
      .voc-map-contenedor {
        width: 100%;
        height: 600px;
      }
      #voc-map {
        height: 600px;
        width: 100%;
        position: relative;
        z-index: 1;
      }
      @media (max-width: 699px) {
        #voc-map {
          height: 500px;
        }
      }
      .leaflet-tooltip {
        min-width: 150px;
        max-width: 300px;
        word-wrap: break-word;
        white-space: normal;
        font-size: 14px;
        font-family: "Guardian TextSans Regular", sans-serif;
      }
      .leaflet-tooltip .highlighted {
        font-family: "Guardian TextSans Medium", sans-serif;
        font-weight: bold;
      }
      .leaflet-container {
        font-family: "Guardian TextSans Regular", sans-serif;
      }
      .leaflet-bar {
        background: white;
        border-radius: 4px;
        border: 1px solid #969594;
      }
      .leaflet-bar a {
        background-color: white;
        text-align: center;
        cursor: pointer;
        color: #202020;
      }
      .leaflet-bar a:hover {
        background-color: #f0f0f0;
      }
      .leaflet-reset-icon svg {
        width: 24px;
        height: 24px;
      }
      .legend {
        background: white;
        padding: 10px;
        line-height: 18px;
        color: #555;
        font-size: 14px;
      }
      .legend i {
        width: 18px;
        height: 18px;
        float: left;
        margin-right: 8px;
        opacity: 0.7;
      }
      #buscador {
        width: 70%;
        padding: 5px;
      }
      #buscarBtn {
        padding: 5px;
      }
      .utm-coords {
        position: absolute;
        bottom: 10px;
        right: 10px;
        background: rgba(255, 255, 255, 0.8);
        padding: 5px;
        font-size: 12px;
        border-radius: 3px;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <div class="voc-map-contenedor">
      <div style="margin-bottom: 10px">
        <input
          type="text"
          id="buscador"
          placeholder="Calle y número, ej: Santa Marina 5"
        />
        <button id="buscarBtn">Buscar</button>
      </div>
      <div id="voc-map"></div>
      <div id="utm-coords" class="utm-coords">UTM 29N: 0, 0</div>
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.0/proj4.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.2/proj4leaflet.min.js"></script>
    <script>
      // Definir las proyecciones
      proj4.defs("EPSG:25829", "+proj=utm +zone=29 +ellps=GRS80 +units=m +no_defs");
      proj4.defs("WGS84", "+proj=longlat +ellps=WGS84 +datum=WGS84 +no_defs");

      // Crear el CRS personalizado para UTM 29N
      const utm29n = new L.Proj.CRS('EPSG:25829',
        '+proj=utm +zone=29 +ellps=GRS80 +units=m +no_defs', {
          resolutions: [
            8192, 4096, 2048, 1024, 512, 256, 128,
            64, 32, 16, 8, 4, 2, 1, 0.5, 0.25
          ],
          origin: [0, 0],
          bounds: L.bounds([200000, 3500000], [900000, 5000000]) // Límites aproximados para España occidental
        });

      // Coordenadas UTM 29N de Badajoz (calculadas desde 38.8794°N, -6.9707°W)
      const badajozUTM = [676026, 4305351];

      const map = L.map("voc-map", {
        crs: utm29n,
        center: badajozUTM,
        zoom: 1, // Ajustado para UTM
        preferCanvas: true,
        zoomControl: true
      });

      let geojson = null;
      let initialCoordinates = null;

      // Mostrar coordenadas UTM en tiempo real
      const coordsDisplay = document.getElementById('utm-coords');
      map.on('mousemove', function(e) {
        const point = e.containerPoint;
        const latlng = map.containerPointToLatLng(point);
        const utm = proj4('WGS84', 'EPSG:25829', [latlng.lng, latlng.lat]);
        coordsDisplay.innerHTML = `UTM 29N: ${Math.round(utm[0])}, ${Math.round(utm[1])}`;
      });

      function getColor(year) {
        if (year === 0) return "#9b9b9b";
        else if (year >= 1 && year <= 1800) return "#ffffb2";
        else if (year <= 1899) return "#fed976";
        else if (year <= 1920) return "#feb24c";
        else if (year <= 1940) return "#fd8d3c";
        else if (year <= 1969) return "#fc4e2a";
        else if (year <= 1999) return "#f03b20";
        else if (year <= 2008) return "#bd0026";
        else if (year <= 2020) return "#800026";
        else if (year <= 2025) return "#55001a";
        else return "#000000";
      }

      function style(feature) {
        const year = parseInt(feature.properties.FECHAALTA);
        return {
          fillColor: getColor(year),
          weight: 1,
          opacity: 1,
          color: "#333",
          fillOpacity: 0.7,
        };
      }

      function highlightFeature(e) {
        const layer = e.target;
        layer.setStyle({
          weight: 2,
          color: "#000",
          fillOpacity: 0.9,
        });
        layer.bringToFront();
      }

      function resetHighlight(e) {
        if (geojson) geojson.resetStyle(e.target);
      }

      function zoomToFeature(e) {
        map.fitBounds(e.target.getBounds());
      }

      function onEachFeature(feature, layer) {
        if (feature.properties) {
          const popupContent = `
            <div>
                <span class='highlighted'>Calle:</span> ${feature.properties.CALLE}<br>
                <span class='highlighted'>Número:</span> ${feature.properties.NUMERO}<br>
                <span class='highlighted'>Año de construcción:</span> ${feature.properties.FECHAALTA}<br>
                <span class='highlighted'>Metros cuadrados:</span> ${feature.properties.AREA}
            </div>`;
          layer.bindPopup(popupContent);
        }
        layer.on({
          mouseover: highlightFeature,
          mouseout: resetHighlight,
          click: zoomToFeature,
        });
      }

      function loadGeoJSON(url) {
        fetch(url)
          .then((response) => response.json())
          .then((data) => {
            // Transformar coordenadas del GeoJSON si están en WGS84
            if (data.crs && data.crs.properties && data.crs.properties.name.includes('4326')) {
              // El GeoJSON está en WGS84, transformar a UTM 29N
              data.features.forEach(feature => {
                if (feature.geometry.type === 'Polygon') {
                  feature.geometry.coordinates[0] = feature.geometry.coordinates[0].map(coord => {
                    const utm = proj4('WGS84', 'EPSG:25829', coord);
                    return utm;
                  });
                } else if (feature.geometry.type === 'MultiPolygon') {
                  feature.geometry.coordinates = feature.geometry.coordinates.map(polygon =>
                    polygon.map(ring =>
                      ring.map(coord => {
                        const utm = proj4('WGS84', 'EPSG:25829', coord);
                        return utm;
                      })
                    )
                  );
                }
              });
            }

            geojson = L.geoJSON(data, {
              style: style,
              onEachFeature: onEachFeature,
            }).addTo(map);

            // Ajustar vista al contenido
            if (geojson.getBounds && geojson.getBounds().isValid()) {
              map.fitBounds(geojson.getBounds());
            }
            initialCoordinates = map.getCenter();
          })
          .catch((err) => console.error("Error al cargar GeoJSON:", err));
      }

      function addLegend() {
        const legend = L.control({ position: "bottomleft" });
        legend.onAdd = function () {
          const div = L.DomUtil.create("div", "legend");
          const grades = [
            "0",
            "1-1800",
            "1800-1899",
            "1900-1920",
            "1921-1940",
            "1941-1969",
            "1970-1999",
            "2000-2008",
            "2009-2020",
            "2021-2025",
          ];
          grades.forEach((grade) => {
            let year;
            switch (grade) {
              case "0":
                year = 0;
                break;
              case "1-1800":
                year = 1800;
                break;
              case "1800-1899":
                year = 1899;
                break;
              case "1900-1920":
                year = 1920;
                break;
              case "1921-1940":
                year = 1940;
                break;
              case "1941-1969":
                year = 1969;
                break;
              case "1970-1999":
                year = 1999;
                break;
              case "2000-2008":
                year = 2008;
                break;
              case "2009-2020":
                year = 2020;
                break;
              case "2021-2025":
                year = 2025;
                break;
            }
            div.innerHTML += `<i style="background:${getColor(
              year
            )}"></i> ${grade}<br>`;
          });
          return div;
        };
        legend.addTo(map);
      }

      function addResetButton() {
        const resetButton = L.control({ position: "bottomright" });
        resetButton.onAdd = function (map) {
          const div = L.DomUtil.create("div", "leaflet-bar");
          div.innerHTML = `
            <a href="#" class="leaflet-reset-icon" style="display:flex;justify-content:center;align-items:center;">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 24.0009V16.0009H24V19.0009H19V24.0009H16ZM5 24.0009V19.0009H0V16.0009H8V24.0009H5ZM16 8.00586V0.00585938H19V5.00586H24V8.00586H16ZM8 8.00586H0V5.00586H5V0.00585938H8V8.00586Z" fill="#202020"/>
                </svg>
            </a>`;
          div.firstChild.onclick = function (e) {
            e.preventDefault();
            if (geojson) {
              map.fitBounds(geojson.getBounds());
              geojson.eachLayer((layer) => geojson.resetStyle(layer));
            }
          };
          return div;
        };
        resetButton.addTo(map);
      }

      function normalizarTexto(texto) {
        return texto
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .trim();
      }

      // Nota: Los tiles de OpenStreetMap están en Web Mercator (EPSG:3857)
      // Para usar con UTM necesitarías tiles específicos en UTM o usar solo overlays vectoriales
      // Por ahora usamos solo los datos vectoriales sin mapa base
      console.log("Mapa configurado en UTM 29N sin mapa base raster");

      // Cargar el GeoJSON
      loadGeoJSON(
        "https://raw.githubusercontent.com/ahorrillo/Mapas/refs/heads/main/mapa/PARCELA-FINAL_actualizado_min.json"
      );

      addLegend();
      addResetButton();

      document.getElementById("buscarBtn").addEventListener("click", () => {
        const input = normalizarTexto(
          document.getElementById("buscador").value
        );
        if (!geojson || !input) return;
        geojson.eachLayer((layer) => geojson.resetStyle(layer));

        let encontrado = false;
        let soloCalle = false;
        geojson.eachLayer((layer) => {
          const calle = normalizarTexto(layer.feature.properties.CALLE || "");
          const numero = layer.feature.properties.NUMERO?.toString() || "";
          if (input === calle + " " + numero) {
            map.fitBounds(layer.getBounds());
            layer.openPopup();
            layer.setStyle({ weight: 3, color: "#0000ff", fillOpacity: 0.9 });
            encontrado = true;
          }
        });
        if (!encontrado) {
          geojson.eachLayer((layer) => {
            const calle = normalizarTexto(layer.feature.properties.CALLE || "");
            if (input === calle) {
              map.fitBounds(layer.getBounds());
              layer.openPopup();
              layer.setStyle({ weight: 3, color: "#0000ff", fillOpacity: 0.9 });
              soloCalle = true;
            }
          });
        }
        if (!encontrado && !soloCalle) {
          alert("No se encontró la dirección o calle.");
        }
      });
    </script>
  </body>
</html>
