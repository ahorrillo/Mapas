<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de Badajoz - Edificios por año</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="https://s1.ppllstatics.com/starfish/1.5.93/starfish-home.css">
    <!-- 1. Load Leaflet first -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <!-- 2. Then load Proj4js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.8.0/proj4.js"></script>
    <!-- 3. Finally, load Proj4Leaflet -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4leaflet/1.0.2/proj4leaflet.js"></script>
    <style>
      .leaflet-tile {
        filter: grayscale(1) contrast(0.5) brightness(1.3);
      }
      .leaflet-interactive:focus {
        outline: none;
        box-shadow: none;
      }
      .voc-map-contenedor {
        width: 100%;
        height: 600px;
      }
      #voc-map {
        height: 600px;
        width: 100%;
        position: relative;
        z-index: 1;
      }
      @media (max-width: 699px) {
        #voc-map {
          height: 500px;
        }
      }
      .leaflet-tooltip {
        min-width: 150px;
        max-width: 300px;
        word-wrap: break-word;
        white-space: normal;
        font-size: 14px;
        font-family: "Guardian TextSans Regular", sans-serif;
      }
      .leaflet-tooltip .highlighted {
        font-family: "Guardian TextSans Medium", sans-serif;
        font-weight: bold;
      }
      .leaflet-container {
        font-family: "Guardian TextSans Regular", sans-serif;
      }
      .leaflet-bar {
        background: white;
        border-radius: 4px;
        border: 1px solid #969594;
      }
      .leaflet-bar a {
        background-color: white;
        text-align: center;
        cursor: pointer;
        color: #202020;
      }
      .leaflet-bar a:hover {
        background-color: #f0f0f0;
      }
      .leaflet-reset-icon svg {
        width: 24px;
        height: 24px;
      }
      .legend {
        background: white;
        padding: 10px;
        line-height: 18px;
        color: #555;
        font-size: 14px;
      }
      .legend i {
        width: 18px;
        height: 18px;
        float: left;
        margin-right: 8px;
        opacity: 0.7;
      }
      #buscador {
        width: 70%;
        padding: 5px;
      }
      #buscarBtn {
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <div class="voc-map-contenedor">
      <div style="margin-bottom: 10px">
        <input
          type="text"
          id="buscador"
          placeholder="Calle y número, ej: Santa Marina 5"
        />
        <button id="buscarBtn">Buscar</button>

      </div>
      <div id="voc-map"></div>
    </div>

    <script>
      // Definir la proyección UTM 29N
      proj4.defs("EPSG:25829", "+proj=utm +zone=29 +ellps=GRS80 +units=m +no_defs");
      proj4.defs("WGS84", "+proj=longlat +ellps=WGS84 +datum=WGS84 +no_defs");

      const map = L.map("voc-map", {
        center: [38.8816, -6.9703], // Coordenadas de Badajoz
        zoom: 15,
        preferCanvas: true // Mejor rendimiento para muchos elementos
      });

      let geojson = null;
      let initialCoordinates = null;

      function getColor(year) {
        if (year === 0) return "#9b9b9b";
        else if (year >= 1 && year <= 1800) return "#ffffb2";
        else if (year <= 1899) return "#fed976";
        else if (year <= 1920) return "#feb24c";
        else if (year <= 1940) return "#fd8d3c";
        else if (year <= 1969) return "#fc4e2a";
        else if (year <= 1999) return "#f03b20";
        else if (year <= 2008) return "#bd0026";
        else if (year <= 2020) return "#800026";
        else if (year <= 2025) return "#55001a";
        else return "#000000";
      }

      function style(feature) {
        const year = parseInt(feature.properties.FECHAALTA);
        return {
          fillColor: getColor(year),
          weight: 1,
          opacity: 1,
          color: "#333",
          fillOpacity: 0.7,
        };
      }

      function highlightFeature(e) {
        const layer = e.target;
        layer.setStyle({
          weight: 2,
          color: "#000",
          fillOpacity: 0.9,
        });
        layer.bringToFront();
      }

      function resetHighlight(e) {
        if (geojson) geojson.resetStyle(e.target);
      }

      function zoomToFeature(e) {
        map.fitBounds(e.target.getBounds());
      }

      function onEachFeature(feature, layer) {
        if (feature.properties) {
          const popupContent = `
            <div>
                <span class='highlighted'>Calle:</span> ${feature.properties.CALLE}<br>
                <span class='highlighted'>Número:</span> ${feature.properties.NUMERO}<br>
                <span class='highlighted'>Año de construcción:</span> ${feature.properties.FECHAALTA}<br>
                <span class='highlighted'>Metros cuadrados:</span> ${feature.properties.AREA}
            </div>`;
          layer.bindPopup(popupContent);
        }
        layer.on({
          mouseover: highlightFeature,
          mouseout: resetHighlight,
          click: zoomToFeature,
        });
      }

      function loadGeoJSON(url) {
        fetch(url)
          .then((response) => response.json())
          .then((data) => {
            // Si el GeoJSON está en coordenadas geográficas, necesitamos transformarlo a UTM 29N
            if (data.crs && data.crs.properties && data.crs.properties.name === "urn:ogc:def:crs:EPSG::25829") {
              // El GeoJSON ya está en UTM 29N
              geojson = L.Proj.geoJson(data, {
                style: style,
                onEachFeature: onEachFeature,
              }).addTo(map);
            } else {
              // Transformar de WGS84 a UTM 29N
              const transformedData = transformGeoJSONToUTM29(data);
              geojson = L.Proj.geoJson(transformedData, {
                style: style,
                onEachFeature: onEachFeature,
              }).addTo(map);
            }

            initialCoordinates = map.getCenter();
          })
          .catch((err) => console.error("Error al cargar GeoJSON:", err));
      }

      function transformGeoJSONToUTM29(geojsonData) {
        // Función para transformar coordenadas de WGS84 a UTM 29N
        function transformCoordinate(coord) {
          return proj4('EPSG:4326', 'EPSG:25829', coord);
        }

        function transformGeometry(geometry) {
          if (geometry.type === 'Point') {
            geometry.coordinates = transformCoordinate(geometry.coordinates);
          } else if (geometry.type === 'LineString' || geometry.type === 'MultiPoint') {
            geometry.coordinates = geometry.coordinates.map(transformCoordinate);
          } else if (geometry.type === 'Polygon' || geometry.type === 'MultiLineString') {
            geometry.coordinates = geometry.coordinates.map(ring =>
              ring.map(transformCoordinate)
            );
          } else if (geometry.type === 'MultiPolygon') {
            geometry.coordinates = geometry.coordinates.map(polygon =>
              polygon.map(ring => ring.map(transformCoordinate))
            );
          }
          return geometry;
        }

        geojsonData.features.forEach(feature => {
          feature.geometry = transformGeometry(feature.geometry);
        });

        // Establecer el CRS como UTM 29N
        geojsonData.crs = {
          type: "name",
          properties: {
            name: "urn:ogc:def:crs:EPSG::25829"
          }
        };

        return geojsonData;
      }

      function addLegend() {
        const legend = L.control({ position: "bottomleft" });
        legend.onAdd = function () {
          const div = L.DomUtil.create("div", "legend");
          const grades = [
            "0",
            "1-1800",
            "1800-1899",
            "1900-1920",
            "1921-1940",
            "1941-1969",
            "1970-1999",
            "2000-2008",
            "2009-2020",
            "2021-2025",
          ];
          grades.forEach((grade) => {
            let year;
            switch (grade) {
              case "0":
                year = 0;
                break;
              case "1-1800":
                year = 1800;
                break;
              case "1800-1899":
                year = 1899;
                break;
              case "1900-1920":
                year = 1920;
                break;
              case "1921-1940":
                year = 1940;
                break;
              case "1941-1969":
                year = 1969;
                break;
              case "1970-1999":
                year = 1999;
                break;
              case "2000-2008":
                year = 2008;
                break;
              case "2009-2020":
                year = 2020;
                break;
              case "2021-2025":
                year = 2025;
                break;
            }
            div.innerHTML += `<i style="background:${getColor(
              year
            )}"></i> ${grade}<br>`;
          });
          return div;
        };
        legend.addTo(map);
      }

      function addResetButton() {
        const resetButton = L.control({ position: "bottomright" });
        resetButton.onAdd = function (map) {
          const div = L.DomUtil.create("div", "leaflet-bar");
          div.innerHTML = `
            <a href="#" class="leaflet-reset-icon" style="display:flex;justify-content:center;align-items:center;">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M16 24.0009V16.0009H24V19.0009H19V24.0009H16ZM5 24.0009V19.0009H0V16.0009H8V24.0009H5ZM16 8.00586V0.00585938H19V5.00586H24V8.00586H16ZM8 8.00586H0V5.00586H5V0.00585938H8V8.00586Z" fill="#202020"/>
                </svg>
            </a>`;
          div.firstChild.onclick = function (e) {
            e.preventDefault();
            if (geojson) map.fitBounds(geojson.getBounds());
            geojson.eachLayer((layer) => geojson.resetStyle(layer));
          };
          return div;
        };
        resetButton.addTo(map);
      }

      function normalizarTexto(texto) {
        return texto
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase()
          .trim();
      }

      // Añadir capa base (puedes cambiar esto por una capa en UTM 29N si está disponible)
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution:
          '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      }).addTo(map);

      loadGeoJSON(
        "https://raw.githubusercontent.com/ahorrillo/Mapas/refs/heads/main/mapa/PARCELA-FINAL_actualizado_min.json"
      );

      addLegend();

      addResetButton();

      document.getElementById("buscarBtn").addEventListener("click", () => {
        const input = normalizarTexto(
          document.getElementById("buscador").value
        );
        if (!geojson || !input) return;
        geojson.eachLayer((layer) => geojson.resetStyle(layer));

        let encontrado = false;
        let soloCalle = false;
        geojson.eachLayer((layer) => {
          const calle = normalizarTexto(layer.feature.properties.CALLE || "");
          const numero = layer.feature.properties.NUMERO?.toString() || "";
          if (input === calle + " " + numero) {
            map.fitBounds(layer.getBounds());
            layer.openPopup();
            layer.setStyle({ weight: 3, color: "#0000ff", fillOpacity: 0.9 });
            encontrado = true;
          }
        });
        if (!encontrado) {
          geojson.eachLayer((layer) => {
            const calle = normalizarTexto(layer.feature.properties.CALLE || "");
            if (input === calle) {
              map.fitBounds(layer.getBounds());
              layer.openPopup();
              layer.setStyle({ weight: 3, color: "#0000ff", fillOpacity: 0.9 });
              soloCalle = true;
            }
          });
        }
        if (!encontrado && !soloCalle) {
          alert("No se encontró la dirección o calle.");
        }
      });
    </script>
  </body>
</html>
